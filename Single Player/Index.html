<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two Player Guessing Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="game-container">
      <h2 id="playerTitle">Player 1: Enter your secret number</h2>

      <form id="guessForm">
        <label id="guessLabel" for="guessInput">Enter your secret number</label>
        <input type="password" id="guessInput" min="1" max="100" required />
        <button type="submit" id="Submit">Submit</button>
      </form>

      <p id="message"></p>

      <!-- Game Information -->
      <div class="game-info">
        <h2 id="currentPlayer">Player 1</h2>

        <p>
          Previous Guesses:
          <span id="previousGuesses"></span>
        </p>

        <p>
          Remaining Guesses:
          <span id="remainingGuesses">10</span>
        </p>

        <p id="lowOrHigh"></p>
      </div>
      <div id="startOver"></div>
    </div>

    <script src="Multi_player.js"></script>
  </body>
</html>
