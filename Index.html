<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="game-container">
      <h1>Guess the Number</h1>

      <p>Guess a number between 1 and 100</p>
      <form id="guessForm">
        <label for="guessInput">Your Guess</label>

        <input type="number" id="guessInput" />

        <button type="submit" id="Submit">Submit Guess</button>
      </form>

      <!-- Game Information -->
      <div class="game-info">
        <p>
          Previous Guesses:
          <span id="previousGuesses"></span>
        </p>

        <p>
          Remaining Guesses:
          <span id="remainingGuesses">10</span>
        </p>
        <p id="lowOrHigh"></p>
      </div>
      <div id="startOver"></div>
    </div>
  </body>
</html>
